# verdict.yaml — Master verdicts against Criteria (enhance.md §12).
# Only the Master writes verdicts (fresh context, via `goalspec judge apply`).
# The Subagent may only produce evidence, never a final verdict.
#
# IMPORTANT: `goalspec judge apply <file>` takes a SINGLE verdict object per call
# (the top-level fields below), NOT this list. This file is the ACCUMULATOR that
# judge apply appends each applied verdict into (`verdicts: [...]`). Each entry:
#   - criteria_ref: "CRIT-..."
#   - evidence_refs: [EV-...]
#   - contract_hash: "<sha256:...>"
#   - evidence_hash: "<sha256:...>"          # global evidence.yaml audit hash
#   - evidence_basis_hash: "<sha256:...>"    # hash of cited evidence_refs only
#   - criterion_hash: "<sha256:...>"         # injected at apply: this criterion's
#                                            # content (incl. cited evidence_
#                                            # requirements); scoped freshness
#   - goal_hash: "<sha256:...>"              # injected at apply: goal.md snapshot
#   - verdict: pass | fail | insufficient | blocked | stale | reopen_required
#   - coverage_audit:                       # OPTIONAL, preferred for pass verdicts.
#       - claim: "<atomic claim from criterion.statement>"
#         evidence_refs: [EV-...]           # must be non-empty; union must cover verdict.evidence_refs
#         sufficiency: sufficient | insufficient | partial
#         why: "..."
#     If present, `judge apply` checks completeness (every claim binds >=1
#     evidence, every cited evidence appears in some claim) and skips the legacy
#     free-text token check on `reason`. If absent, `reason` must contain the
#     tokens Coverage audit: / claim / evidence / sufficiency / conclusion.
#   - reason: "..."                         # always required (schema); short conclusion when coverage_audit present
#   - context: fresh
#   - evaluated_by: master
verdicts: []
