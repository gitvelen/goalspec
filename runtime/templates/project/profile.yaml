# Project profile — long-term project facts.
project:
  name: ""
  type: ""
stack:
  languages: []
  frameworks: []
  package_managers: []
  runtimes: []
commands:
  # test/build/lint/typecheck run at /goalspec close as final verification.
  # They MUST be sandbox-reproducible — no live DB/Redis/Browser/LLM. Tests that
  # need external services belong in environment.smoke_tests / fidelity / CI,
  # not here: a missing service fails close as if the code were broken.
  test: []
  build: []
  lint: []
  typecheck: []
  # Optional security / dependency gates — run at /goalspec close as final
  # verification, on the same path as test/build/lint/typecheck. Leave empty
  # to skip. A non-zero exit fails close (same as a failing test).
  # Examples:
  #   audit: ["npm audit --omit=dev", "pip-audit -q", "cargo audit"]
  #   sast:  ["semgrep --config=auto --error src/"]
  audit: []
  sast: []
environment:
  required_services: []
  required_env_vars: []
  local_setup_notes: []
  # Smoke gate (opt-in). A small number of end-to-end tests that physically
  # traverse invariants OUTSIDE the implementer's control — a real DB engine's
  # constraints (postgres NOT NULL/UNIQUE, not sqlite create_all), a real
  # service process's middleware, real I/O. A passing smoke test cannot be
  # faked by a test helper or a sqlite fixture. Velentrade postmortem: 4
  # shipped bugs were all surfaced by a single real owner-login e2e that close
  # never ran. Configure the core user journey(s) only — this is "locally hard"
  # over "globally soft" (a soft full-coverage gate equals zero).
  smoke_tests: []
  # smoke_tests:
  #   - command: "scripts/smoke-owner-login.sh"   # real HTTP login, asserts 200
  #     fidelity: integration                      # binds to boundaries.integration
  # Fidelity bindings (opt-in). When enabled, close re-runs each smoke test
  # under its boundary (bootstrap → command → teardown). enforce_on_close makes
  # a failing smoke test fail close; otherwise it warns. With no smoke_tests
  # configured, close emits SMOKE_WARNING + RALPH_WIGGUM_WARNING (the all-soft
  # close) but still succeeds — backward compatible.
  fidelity:
    enabled: false
    enforce_on_close: false
    boundaries:
      integration:
        bootstrap: ""        # e.g. "docker compose up -d postgres && alembic upgrade head"
        env: {}              # e.g. {DATABASE_URL: "postgresql://user@host/db"}
        teardown: ""         # e.g. "docker compose down -v"
        fingerprint: {}      # advisory {db_dialect: postgresql, schema_source: migration}
tools: []
# /goalspec close delivery mode — pick by team workflow (see README "Delivery modes"):
#   github_pr    — commit + push + open a PR (default; full automation)
#   push_only    — commit + push to a branch, no PR
#   local_commit — commit only, no push (push forbidden / local-first teams)
#   archive_only — archive to .goalspec/history/, touch no git at all
#                  (teams with their own release/PR/CI pipeline)
delivery:
  mode: github_pr
  remote: origin
  base_branch: main
  # scan_allow_paths: glob patterns for paths exempt from the close-time secret
  # scan (e.g. tests/fixtures/docs with hard-coded DUMMY credentials). Only list
  # paths you have confirmed contain NO real credentials — an exempted real leak
  # is not caught. Empty (default) = scan everything.
  # scan_allow_paths:
  #   - "tests/**"
  #   - "docs/**"
  scan_allow_paths: []
# run-loop stop-loss: the Master/Subagent loop inside a single /goalspec run is
# capped at this many judge-apply rounds. Set before the loop runs (Akshy: exit
# conditions are decided before running, not during). Default 8.
# stall_threshold: no-progress detector. If the verdict fingerprint and the
# evidence_hash are both unchanged for this many consecutive judge-apply rounds,
# the loop is marked stalled (Oracle: no-progress detection). stalled is distinct
# from capped — capped means the budget is exhausted (close or raise it), stalled
# means the loop is spinning on an unsolvable spec defect (reopen). Default 3.
run_loop:
  max_iterations: 40
  stall_threshold: 3
